<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>BRNOUT - Automation Workflow Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Facebook SDK for Instagram integration -->
    <script>
      // Facebook SDK initialization
      window.fbAsyncInit = function() {
        FB.init({
          appId      : '573274152454213', // Use the Instagram client ID provided by the user
          cookie     : true,
          xfbml      : true,
          version    : 'v17.0'  // Use a compatible version
        });
        
        // Check login status on page load
        FB.getLoginStatus(function(response) {
          console.log('Facebook login status check:', response);
          
          // Call the statusChangeCallback function with the response
          if (typeof window.statusChangeCallback === 'function') {
            window.statusChangeCallback(response);
          }
        });
      };
      
      // Load the Facebook SDK asynchronously
      (function(d, s, id) {
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s); js.id = id;
        js.src = "https://connect.facebook.net/en_US/sdk.js";
        fjs.parentNode.insertBefore(js, fjs);
      }(document, 'script', 'facebook-jssdk'));
    </script>
    
    <!-- This script injects a replit badge into the page, please feel free to remove this line -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-badge-v3.js"></script>
  </body>
</html>
